name: Build Canta Arabic APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install SDK packages
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-37" "build-tools;36.0.0" || sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Build release APK
        run: ./gradlew :androidApp:assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact (for debugging/inspection)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canta-apk
          path: androidApp/build/outputs/apk/release/*.apk

      - name: Verify APK (universal, version, unsigned, Arabic)
        run: |
          APK=$(ls androidApp/build/outputs/apk/release/*.apk)
          echo "APK: $APK"
          ls -la "$APK"
          AAPT=$(ls -d $ANDROID_HOME/build-tools/*/aapt | sort -V | tail -1)
          $AAPT dump badging "$APK" | head -3
          $AAPT dump badging "$APK" | grep "versionName='4.1.0-ar2'" || (echo 'WRONG versionName' && exit 1)
          if unzip -l "$APK" | grep -qE 'META-INF/.*\.(RSA|DSA|EC|SF)'; then echo 'APK IS SIGNED - expected unsigned'; exit 1; fi
          echo "--- lib dirs ---"
          unzip -l "$APK" | grep 'lib/' || echo "no native libs: universal"
          python3 - <<'EOF'
          import glob, zipfile, xml.etree.ElementTree as ET
          apk = glob.glob('androidApp/build/outputs/apk/release/*.apk')[0]
          z = zipfile.ZipFile(apk)
          # ABI check: if any native lib exists, both 32-bit and 64-bit arm must be present
          libs = [n for n in z.namelist() if n.startswith('lib/') and n.endswith('.so')]
          abis = sorted({n.split('/')[1] for n in libs})
          print('ABIs:', abis or 'none (pure Kotlin: runs on 32+64 bit)')
          if libs:
              assert 'armeabi-v7a' in abis and 'arm64-v8a' in abis, 'MISSING arm ABI (need 32+64 bit)'
          # Arabic strings live in Compose Multiplatform assets: assets/composeResources/**/values-ar*/strings.commonMain.cvr
          # cvr format: lines 'string|name|<base64-utf8 value>' (base64 may lack padding)
          tree = ET.parse('composeApp/src/commonMain/composeResources/values-ar/strings.xml')
          vals = {e.get('name'): (e.text or '') for e in tree.getroot() if e.tag == 'string'}
          import base64
          found = {}
          cvr_files = [n for n in z.namelist() if n.startswith('assets/composeResources/') and '/values-ar/' in n and n.endswith('.cvr')]
          assert cvr_files, 'no values-ar compose resources (.cvr) in APK'
          assert not any('values-ar-r' in n for n in z.namelist() if n.endswith('.cvr')), 'region-qualified Arabic cvr present: resolution bug'
          assert cvr_files, 'no Arabic compose resources (.cvr) in APK'
          for n in cvr_files:
              for line in z.read(n).decode('utf-8').splitlines():
                  parts = line.split('|')
                  if len(parts) == 3 and parts[0] == 'string':
                      b = parts[2] + '=' * (-len(parts[2]) % 4)
                      found[parts[1]] = base64.b64decode(b).decode('utf-8')
          print('Arabic cvr files:', cvr_files, '| strings decoded:', len(found))
          for key in ['device_user', 'device_user_description', 'select_all', 'loading_apps']:
              got = found.get(key)
              assert got == vals[key], f'{key}: got {got!r} want {vals[key]!r}'
              print('Arabic OK:', key, '=', got)
          print('Arabic strings verified in APK')
          # No visible links: decoded Arabic + default string resources must contain no http(s) URLs
          default_tree = ET.parse('composeApp/src/commonMain/composeResources/values/strings.xml')
          for fname, vals2 in [('default', {e.get('name'): (e.text or '') for e in default_tree.getroot() if e.tag == 'string'}), ('values-ar', found)]:
              bad = {k: v for k, v in vals2.items() if 'http://' in v or 'https://' in v}
              assert not bad, f'URLs present in {fname} strings: {bad}'
          print('No URLs in visible string resources')
          EOF

      - name: Create source zip
        run: git archive -o canta-4.1.0-ar2-source.zip HEAD

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.1.0-ar2
          name: Canta 4.1.0-ar2 (Arabic, universal)
          body: |
            Canta 4.1.0 - Arabic custom build (ar2).
            Unsigned universal APK (pure Kotlin: runs on 32-bit and 64-bit).
            Full modified source code included in the zip.
          files: |
            androidApp/build/outputs/apk/release/*.apk
            canta-4.1.0-ar2-source.zip
